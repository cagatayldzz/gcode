name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: 1 · Validate
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Validate release requirements
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          for variable in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            test -n "${!variable}" || { echo "Add the $variable Actions secret." >&2; exit 1; }
          done
      - run: rustup default stable
      - name: Check scripts and formatting
        run: |
          bash scripts/tests/run.sh
          cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core
      - name: Lint core packages
        run: cargo clippy --locked -p ws-terminal -p ws-git -p ws-storage -p ws-commitgen -p ws-activity -p ws-hosting -p ws-version -p ws-updater -p ws-index --all-targets -- -D warnings
      - name: Test core packages
        run: cargo test --locked -p ws-terminal -p ws-git -p ws-storage -p ws-commitgen -p ws-activity -p ws-hosting -p ws-version -p ws-updater -p ws-index

  prepare:
    name: 2 · Prepare version
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare version once
        id: version
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: bash scripts/release.sh prepare
      - name: Check for an existing release
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "This release already exists. Inspect or remove its draft before retrying." >&2
            exit 1
          fi
      - name: Generate release notes
        run: bash scripts/release.sh notes
      - name: Preserve versioned build inputs
        uses: actions/upload-artifact@v7
        with:
          name: release-inputs
          path: |
            Cargo.toml
            Cargo.lock
            package.json
            apps/desktop/macos/Info.plist
            dist/RELEASE_NOTES.md

  macos_arm64:
    name: 3 · macOS build
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 120
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/build-release
        with:
          arch: arm64
          release-tag: ${{ needs.prepare.outputs.tag }}

  # The lint and the tests run beside the build, not after it, on the unstamped code: they do not need the new version, and
  # their cache key stays the same from one release to the next.
  macos_checks:
    name: 3 · macOS lint and tests
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos-checks
      - name: Lint and test the workspace
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace

  verify:
    name: 4 · Verify packages
    if: success()
    needs: [validate, prepare, macos_arm64, macos_checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: release-inputs
          path: .
      - uses: actions/download-artifact@v8
        with:
          pattern: release-macos-*
          merge-multiple: true
          path: dist
      - name: Verify the package and generate checksums
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: bash scripts/release.sh finalize
      - name: Preserve verified release
        uses: actions/upload-artifact@v7
        with:
          name: verified-release
          if-no-files-found: error
          path: |
            dist/*-macos-arm64.zip
            dist/SHA256SUMS.txt
            dist/install.sh
            dist/RELEASE_NOTES.md

  publish:
    name: 5 · Publish
    if: success()
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Creating the release and its tag is the only job that writes to the repository.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: verified-release
          path: dist
      - name: Publish GitHub release
        run: |
          cd dist
          sha256sum --check SHA256SUMS.txt
          bash -n install.sh
          # The product's name is the start of the archive's name: <name>-<tag>-macos-arm64.zip.
          archive="$(ls ./*-macos-arm64.zip | head -n 1)"
          product="${archive#./}"
          product="${product%%-"$RELEASE_TAG"-*}"
          gh release create "$RELEASE_TAG" ./*-macos-arm64.zip SHA256SUMS.txt install.sh \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --title "$product ${RELEASE_TAG#v}" \
            --notes-file RELEASE_NOTES.md --draft
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
