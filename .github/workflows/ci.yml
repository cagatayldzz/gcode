name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The GPUI crates need macOS; the release workflow lints and tests the whole workspace.
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: rustup default stable
      - name: Test release automation
        run: bash scripts/tests/run.sh
      - name: Check formatting
        run: cargo fmt --all -- --check

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint
        run: cargo clippy --locked -p ws-terminal -p ws-git -p ws-storage -p ws-opencommit -p ws-hosting -p ws-version -p ws-updater -p ws-index --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked -p ws-terminal -p ws-git -p ws-storage -p ws-opencommit -p ws-hosting -p ws-version -p ws-updater -p ws-index

  interface:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - run: rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: interface
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # A failing test must not leave the next run with a cold cache (a cold run is about 13 minutes).
          cache-on-failure: true
      # One build profile for both steps: `cargo check` would compile every dependency a second time.
      - name: Build the interface crates
        run: cargo test --locked -p ws-ui -p ws-app --no-run
      - name: Open and draw the window headlessly
        run: cargo test --locked -p ws-ui --test window_render
