name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The GPUI crates need macOS; the release workflow lints and tests the whole workspace.
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: rustup default stable
      - name: Test release automation
        run: bash scripts/tests/run.sh
      - name: Check formatting
        run: cargo fmt --all -- --check

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint
        run: cargo clippy --locked -p vekro-terminal -p vekro-git -p vekro-storage -p vekro-opencommit -p vekro-hosting -p vekro-version -p vekro-updater -p vekro-index --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked -p vekro-terminal -p vekro-git -p vekro-storage -p vekro-opencommit -p vekro-hosting -p vekro-version -p vekro-updater -p vekro-index

  interface:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - run: rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: interface
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check the interface crates
        run: cargo check --locked -p vekro-ui -p vekro-app
      - name: Open and draw the window headlessly
        run: cargo test --locked -p vekro-ui --test window_render
