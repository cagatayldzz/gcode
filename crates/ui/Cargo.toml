[package]
name = "vekro-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Vekro interface views built with GPUI Kit"

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
vekro-storage.workspace = true
vekro-terminal.workspace = true
vekro-git.workspace = true
vekro-opencommit.workspace = true
vekro-hosting.workspace = true
vekro-updater.workspace = true
gpui-kit.workspace = true
gpui-kit-assets.workspace = true
futures.workspace = true
unicode-width = "0.2.3"
ignore = "0.4.34"
globset = "0.4.21"
regex = "1.13.2"
tempfile = "3.27.0"
rustix = { version = "1.1.6", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }
