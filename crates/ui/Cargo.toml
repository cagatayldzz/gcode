[package]
name = "ws-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Interface views built with GPUI Kit"

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
ws-activity.workspace = true
ws-product.workspace = true
ws-storage.workspace = true
ws-index.workspace = true
ws-terminal.workspace = true
ws-git.workspace = true
ws-commitgen.workspace = true
ws-language.workspace = true
anyhow = "1.0.105"
lsp-types = { version = "0.97.0", features = ["proposed"] }
ws-hosting.workspace = true
ws-updater.workspace = true
gpui-kit.workspace = true
gpui-kit-assets.workspace = true
futures.workspace = true
serde_json.workspace = true
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-swift = "0.7.4"
unicode-width = "0.2.3"
ignore = "0.4.35"
globset = "0.4.22"
regex = "1.13.2"
tempfile = "3.27.0"
rustix = { version = "1.1.6", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

[dev-dependencies]
git2.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }

[[bench]]
name = "performance"
harness = false
test = false
