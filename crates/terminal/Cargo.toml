[package]
name = "ws-terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Shell session: PTY, terminal emulation and key encoding"

[package.metadata.layers]
dependencies = ["alacritty_terminal", "rustix"]

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
ws-product.workspace = true
alacritty_terminal.workspace = true
serde_json.workspace = true
unicode-width = "0.2.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["termios", "process"] }

[dev-dependencies]
tempfile = "3.27.0"
