[workspace]
resolver = "2"
members = ["apps/*", "crates/*"]
default-members = ["apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false
license = "UNLICENSED"
repository = "https://github.com/cagatayldzz/gcode"

[workspace.dependencies]
ws-product = { path = "crates/product" }
ws-terminal = { path = "crates/terminal" }
ws-storage = { path = "crates/storage" }
ws-index = { path = "crates/index" }
ws-app = { path = "crates/app" }
ws-ui = { path = "crates/ui" }
alacritty_terminal = "0.26.0"
gpui-kit = { version = "0.10.0", features = [
  "gpui-fast",
  "tree-sitter-bash",
  "tree-sitter-css",
  "tree-sitter-go",
  "tree-sitter-html",
  "tree-sitter-javascript",
  "tree-sitter-markdown",
  "tree-sitter-markdown-inline",
  "tree-sitter-python",
  "tree-sitter-rust",
  "tree-sitter-swift",
  "tree-sitter-toml",
  "tree-sitter-tsx",
  "tree-sitter-typescript",
  "tree-sitter-yaml",
] }
gpui-kit-assets = "0.10.0"
futures = "0.3.34"
serde_json = "1.0.154"
git2 = { version = "0.21.0", default-features = false }
ws-git = { path = "crates/git" }
ws-opencommit = { path = "crates/opencommit" }
ws-hosting = { path = "crates/hosting" }
ws-version = { path = "crates/version" }
ws-updater = { path = "crates/updater" }
ureq = { version = "3.5.2", features = ["json"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "deny"
unimplemented = "deny"

[profile.release]
strip = "debuginfo"

# Dependencies (the editor's syntax highlighting above all) are slow without optimization, so they are optimized
# in development builds too. Only the workspace's own crates stay unoptimized, which keeps rebuilds quick.
[profile.dev.package."*"]
debug = false
opt-level = 3

[profile.dev.package.gpui-pre]
opt-level = 3

[profile.dev.package.gpui-pre-platform]
opt-level = 3

[profile.dev.package.gpui-fast]
opt-level = 3

[profile.dev.package.gpui-fast-platform]
opt-level = 3

[profile.dev.package.gpui-component]
opt-level = 3

[profile.dev.package.gpui-kit]
opt-level = 3
