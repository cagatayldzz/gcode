<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x2="0%" y2="100%">
      <stop stop-color="#1c2532"/>
      <stop offset="1" stop-color="#0a0e16"/>
    </linearGradient>
    <radialGradient id="glow" cx="76%" cy="22%" r="76%">
      <stop stop-color="#3568b4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3568b4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x2="0%" y2="100%">
      <stop stop-color="#c7dcff" stop-opacity="0.34"/>
      <stop offset="0.54" stop-color="#819cbf" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#acc6eb" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="left" x2="72%" y2="100%">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4d4ed"/>
    </linearGradient>
    <linearGradient id="right" x1="23%" x2="78%" y2="100%">
      <stop stop-color="#8cc0ff"/>
      <stop offset="1" stop-color="#397aff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="upper"><polygon points="0,0 1004,0 0,1004"/></clipPath>
    <clipPath id="lower"><polygon points="664,380 1500,380 1500,1500 0,1500 0,1044"/></clipPath>
    <mask id="cut" maskUnits="userSpaceOnUse" x="200" y="200" width="624" height="624">
      <rect x="200" y="200" width="624" height="624" fill="#fff"/>
      <circle cx="512" cy="512" r="132" fill="#000"/>
      <rect x="512" y="380" width="320" height="72" fill="#000"/>
    </mask>
  </defs>
  <rect x="100" y="112" width="824" height="824" rx="185" fill="#020611" opacity="0.45" filter="url(#soft)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <!-- A disc cut along a diagonal seam, white above and blue below, with an aperture that makes it a "G". -->
  <g mask="url(#cut)">
    <circle cx="512" cy="512" r="280" fill="url(#left)" clip-path="url(#upper)"/>
    <circle cx="512" cy="512" r="280" fill="url(#right)" clip-path="url(#lower)"/>
  </g>
</svg>
