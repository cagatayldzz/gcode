<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x2="0%" y2="100%">
      <stop stop-color="#1c2532"/>
      <stop offset="1" stop-color="#0a0e16"/>
    </linearGradient>
    <radialGradient id="glow" cx="76%" cy="22%" r="76%">
      <stop stop-color="#3568b4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3568b4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x2="0%" y2="100%">
      <stop stop-color="#c7dcff" stop-opacity="0.34"/>
      <stop offset="0.54" stop-color="#819cbf" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#acc6eb" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="left" x2="72%" y2="100%">
